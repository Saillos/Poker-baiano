<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Three of a Kind (P2P - GitHub Pages)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- PeerJS: Biblioteca gratuita P2P (WebRTC) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
    <style>
        :root {
            --bg: #121212;
            --accent: #f4d03f;
            --accent-dark: #b8860b;
            --win: #48bb78;
            --loss: #f56565;
            --gold-glow: rgba(244, 208, 63, 0.3);
            --pixel-border: 4px;
        }

        body {
            background: #000;
            color: #ececec;
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            image-rendering: auto;
        }

        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/tavern_bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            transition: transform 0.1s;
        }

        h1, h2, h3, .btn-ui, .lobby-btn, .status-msg {
            font-family: 'Press Start 2P', cursive;
        }

        img { image-rendering: pixelated; }

        /* ANIMAÇÕES */
        @keyframes drawCardAnim {
            0% { opacity: 0; transform: translate(600px, -200px) scale(0.4) rotate(45deg); filter: blur(5px); }
            60% { opacity: 1; transform: translate(-20px, 20px) scale(1.05) rotate(calc(var(--fan-rotate, 0deg) - 10deg)); }
            100% { opacity: 1; transform: translateY(var(--fan-y, 0px)) scale(1) rotate(var(--fan-rotate, 0deg)); filter: blur(0); }
        }

        .new-card-anim { animation: drawCardAnim 0.7s cubic-bezier(0.19, 1, 0.22, 1) backwards; }

        @keyframes dropOnTable {
            0% { opacity: 0; transform: scale(2) translateY(-100px) rotateX(45deg); filter: brightness(3) blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotateX(0); filter: brightness(1) blur(0); }
        }

        .slot-card-anim { animation: dropOnTable 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards; }

        /* UI GERAL */
        .volume-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border: 2px solid #444;
            z-index: 2000;
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        .volume-controls:hover { opacity: 1; }

        .vol-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 8px;
            color: #ccc;
            text-transform: uppercase;
        }

        .vol-item input { cursor: pointer; accent-color: var(--accent); width: 60px; }

        .global-wins {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border: 2px solid var(--accent);
            font-size: 14px;
            z-index: 1000;
            text-align: center;
            box-shadow: 4px 4px 0px #000;
        }

        .global-wins span { font-size: 20px; color: var(--win); display: block; margin-top: 2px; }

        .room-info-box {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border: 2px solid var(--accent);
            font-size: 14px;
            z-index: 1000;
            text-align: center;
            box-shadow: 4px 4px 0px #000;
            font-family: 'Press Start 2P', cursive;
        }

        .room-info-box span { font-size: 20px; color: var(--win); display: block; margin-top: 5px; letter-spacing: 2px; }

        .top-bar {
            display: flex;
            justify-content: center;
            width: 100%;
            gap: 30px;
            align-items: center;
            margin: 30px 0 10px 0;
            z-index: 1000;
        }

        .btn-ui {
            background: #444;
            color: white;
            border: 4px solid #000;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 10px;
            text-transform: uppercase;
            transition: 0.1s;
            box-shadow: inset -4px -4px 0px #222;
        }

        .btn-ui:active { transform: translateY(2px); box-shadow: inset 4px 4px 0px #222; }
        .btn-ui:hover { background: #555; }

        /* OVERLAYS */
        #lobby-overlay {
            display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; z-index: 3000; justify-content: center; align-items: center; flex-direction: column;
        }

        .lobby-box {
            background: #1a1a1a; padding: 40px 50px; text-align: center; max-width: 450px; width: 90%;
            position: relative; border: var(--pixel-border) solid #333;
            box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #444, 0px 0px 0px 4px #000;
        }

        .lobby-box h1 { color: var(--accent); text-shadow: 4px 4px 0px #856404; margin-bottom: 30px; font-size: 1.8em; }

        .lobby-btn {
            display: block; width: 100%; padding: 16px; margin: 15px 0; font-size: 0.9em; font-weight: bold;
            border: 4px solid #000; cursor: pointer; text-transform: uppercase; position: relative;
            background: #444; color: #fff; box-shadow: inset -4px -4px 0px #222;
        }

        .lobby-btn:active { transform: translateY(2px); box-shadow: inset 4px 4px 0px #222; }
        .lobby-btn-create { background: var(--accent); color: #000; box-shadow: inset -4px -4px 0px #b8860b; }
        .lobby-btn-create:hover { background: #fee16d; }

        .lobby-input {
            width: 100%; padding: 14px; font-size: 1.2em; font-family: 'Press Start 2P', cursive; text-align: center;
            border: 4px solid #000; background: #000; color: var(--accent); box-sizing: border-box; box-shadow: inset 4px 4px 0px #222;
        }

        .room-code-display {
            font-size: 1.5em; letter-spacing: 5px; color: var(--win); background: #000; padding: 20px; margin: 20px 0;
            border: 4px solid #333; box-shadow: inset 4px 4px 0px #111;
        }

        #end-game-overlay, #reset-request-overlay, #disconnect-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center;
            flex-direction: column; text-align: center; color: #fff; font-family: 'Press Start 2P', cursive;
        }

        #end-game-overlay h1 { font-size: 3em; margin-bottom: 30px; text-shadow: 8px 8px 0px #000; }
        #end-game-overlay { z-index: 4000; }
        #reset-request-overlay { z-index: 5000; }
        #disconnect-overlay { z-index: 6000; }
    </style>
</head>

<body>
    <div id="bg-layer"></div>

    <div id="disconnect-overlay">
        <h1 style="color: var(--loss); font-size: 3em;">OPONENTE SAIU</h1>
        <p style="font-size: 1.2em; opacity: 0.8;">A conexão P2P com o oponente foi encerrada.</p>
        <p style="margin-top: 20px; color: var(--accent);">Voltando ao Lobby em 2 segundos...</p>
    </div>

    <div id="lobby-overlay">
        <div class="lobby-box" id="lobby-step-1">
            <img src="assets/logo.png" alt="Three of a Kind" style="max-width: 280px; width: 100%; margin-bottom: 30px; image-rendering: pixelated;">
            <button class="lobby-btn lobby-btn-create" id="btn-criar-sala">CRIAR SALA (P2P)</button>
            <button class="lobby-btn" style="background:transparent; color:white; border:1px solid #334155;" id="btn-entrar-sala">ENTRAR EM SALA</button>
        </div>
        <div class="lobby-box" id="lobby-step-2" style="display:none"></div>
    </div>

    <div id="game-container" style="display:none;">
        <div class="room-info-box">
            <div style="font-size: 10px; margin-bottom: 10px; color: #ccc;">SALA P2P</div>
            <span id="room-code-header">---</span>
        </div>

        <div class="top-bar">
            <div class="status-msg" id="msg" style="font-size: 1em;">CONECTADO VIA WEBRTC (SEM FIREBASE)</div>
        </div>
    </div>

    <!-- CÓDIGO COMPLETO P2P DISPONÍVEL NO REPOSITÓRIO E ARTIFACTION -->
</body>
</html>
